org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：第二次构建直接跳过配置阶段，是最有效的加速手段
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 增量构建保留常驻 daemon。之前用 --no-daemon 是为了绕开 ~/.gradle 下
# 多个 Gradle 版本（8.5/8.11.1/9.3.1/9.7.1）抢 daemon 锁，代价是每次都
# 冷启动 JVM + 重新配置工程，慢且没必要。正确做法是定期清理僵尸 daemon。

# 工程路径含中文，AGP 默认拒绝构建。
# 本项目不使用 NDK 编译（jniLibs 里全是预编译产物），路径检查的
# 风险面比常规 Android 工程小，故按官方提供的开关放行。
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=36

